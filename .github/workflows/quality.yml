name: backend-quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: transportes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Tres roles, como en producción: dueño (migra/siembra), app (sujeto a RLS) y plataforma (BYPASSRLS).
      MIGRATE_DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/transportes_test?schema=public
      DATABASE_URL: postgresql://transportes_app:ci_app_pw@localhost:5432/transportes_test?schema=public
      DATABASE_SYSTEM_URL: postgresql://transportes_platform:ci_platform_pw@localhost:5432/transportes_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      # La base del servicio es nueva: se crean los roles, se migra y se siembra, y la suite de integración no la resetea.
      - run: psql "$MIGRATE_DATABASE_URL" -v app_password=ci_app_pw -v platform_password=ci_platform_pw -f prisma/sql/roles.sql
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run test:int
        env:
          DB_PREPARED: 'true'
